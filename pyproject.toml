[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "taglid"
dynamic = ["version"]
description = "A Word level Language Identification (LID) tool for Tagalog-English (Taglish) text."
readme = "README.md"
license = {file = "LICENSE.txt"}
authors = [
  {name = "Andrian Lloyd Maagma", email = "maagmaandrian@gmail.com"}
]
keywords = ["Language Identification", "LID", "Taglish", "Code-switching", "Code-mixed", "Tagalog", "English"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
  "lemminflect>=0.2.3",
  "nltk>=3.8.1",
  "openpyxl>=3.1.5",
  "pandas>=2.2.2",
  "symspellpy>=6.7.7",
  "tabulate>=0.9.0",
  "tglstemmer @ git+https://github.com/andrianllmm/tagalog-stemmer.git@main",
]

[dependency-groups]
dev = [
    "commitizen>=4.16.5",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
    "twine>=5.1.1",
    "ty>=0.0.64",
]

[project.urls]
homepage = "https://github.com/andrianllmm/taglid"
issues = "https://github.com/andrianllmm/taglid/issues"

[tool.setuptools]
package-data = {"taglid" = ["resources/*.txt", "resources/*.json", "resources/freqlist/*.csv", "resources/slang/*.txt"]}

[tool.setuptools.dynamic]
version = {attr = "taglid.__version__"}

[tool.ruff]
src = ["src"]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/taglid/lid.py" = ["E402"]
"tests/*" = ["E501"]

[tool.ty.environment]
python-version = "3.10"

[tool.pytest.ini_options]
addopts = "--cov=taglid --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/taglid"]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.0.1"
tag_format = "v$version"
version_scheme = "semver"
version_provider = "commitizen"
version_files = ["src/taglid/__init__.py:__version__"]
update_changelog_on_bump = true
major_version_zero = true
